<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Pet Adoption</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <a href="#">adoptme.com</a>

    <h1>Adopt a <span>Pet</span> Today</h1>

    <div class="cards">

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTp_mIy-6_07A88O5tNiRIszKlAPK8J_eKc-A&s" alt="dog">
            <h3>Meet Jerry</h3>
            <p>
                Jerry is a charming and friendly dog with a heart of gold.
                He is looking for a loving home to call his own.
            </p>
        </div>

        <div class="card">
            <img src="https://img.freepik.com/free-photo/cute-cat-spending-time-outside_23-2150649152.jpg" alt="cat">
            <h3>Meet Tom</h3>
            <p>
                Tom is a handsome and affectionate cat who is looking
                for his forever home.
            </p>
        </div>

    </div>
</div>

</body>
</html>
